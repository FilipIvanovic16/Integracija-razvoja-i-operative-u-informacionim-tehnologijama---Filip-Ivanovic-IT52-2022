spring.application.name=chronoshop

# ===================== Microsoft SQL Server (Code-First) =====================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=chronoshop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA - Code-First: sema se generiše iz entiteta
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ===================== JWT =====================
app.jwt.secret=${JWT_SECRET:Z2VuZXJpc2FuLXRham5pLWtsanVjLXphLWNocm9ub3Nob3AtMjAyNi1lb25pcw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Stripe (test mode) =====================
stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_xxx}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_xxx}

# ===================== CORS / Frontend =====================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===================== Server =====================
server.port=8080

# Inicijalno punjenje baze demo podacima
app.seed.enabled=${SEED_ENABLED:true}

# Upload slika
app.upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
