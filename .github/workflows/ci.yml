name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run mvnw verify (unit + Testcontainers IT + JaCoCo)
        run: ./mvnw -B verify -DskipITs=false

      - name: Upload service jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: services/*/target/site/jacoco*/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload surefire/failsafe test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker build (${{ matrix.name }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: catalog-service
            context: .
            dockerfile: services/catalog-service/Dockerfile
          - name: order-service
            context: .
            dockerfile: services/order-service/Dockerfile
          - name: payment-service
            context: .
            dockerfile: services/payment-service/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t chronoshop/${{ matrix.name }}:ci \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=pk_test_xxx \
            ${{ matrix.context }}
