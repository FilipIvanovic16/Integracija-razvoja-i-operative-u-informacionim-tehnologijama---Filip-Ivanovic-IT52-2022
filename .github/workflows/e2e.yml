name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: Z2VuZXJpc2FuLXRham5pLWtsanVjLXphLWNocm9ub3Nob3AtMjAyNi1lb25pcw==
  STRIPE_WEBHOOK_SECRET: whsec_e2e_test_secret
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

jobs:
  e2e:
    name: End-to-end (Playwright, full docker compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show running containers
        if: always()
        run: docker compose ps

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:5173
          PAYMENT_SERVICE_URL: http://localhost:8084

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
