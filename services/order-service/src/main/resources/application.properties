spring.application.name=order-service
server.port=8083

# ===================== PostgreSQL (orderdb) =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USER:chronoshop}
spring.datasource.password=${DB_PASSWORD:chronoshop}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sema je verzionisana kroz Flyway - Hibernate samo validira da se poklapa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================== REST klijenti ka drugim servisima =====================
app.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
app.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# ===================== RabbitMQ =====================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Retry politika za @RabbitListener: 3 pokusaja sa eksponencijalnim zastojem, zatim
# se poruka odbija bez requeue-a (default nakon iscrpljenih pokusaja) i zavrsava u DLQ-u
# jer red ima podesenu x-dead-letter-exchange (RabbitMqConfig).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
