spring.application.name=catalog-service
server.port=8082

# ===================== PostgreSQL (catalogdb) =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogdb}
spring.datasource.username=${DB_USER:chronoshop}
spring.datasource.password=${DB_PASSWORD:chronoshop}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sema je verzionisana kroz Flyway - Hibernate samo validira da se poklapa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================== Upload slika =====================
app.upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Inicijalno punjenje demo katalogom
app.seed.enabled=${SEED_ENABLED:true}

# ===================== gRPC server (CheckStock/ReserveStock za order-service) =====================
grpc.server.port=${GRPC_PORT:9082}

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
